apiVersion: v1
kind: Service
metadata:
  name: mysql-master
  namespace: shortlink-system
spec:
  selector:
    app: mysql
    role: master
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None

---

apiVersion: v1
kind: Service
metadata:
  name: mysql-slave
  namespace: shortlink-system
spec:
  selector:
    app: mysql
    role: slave
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
