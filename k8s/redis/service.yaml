apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shortlink-system
spec:
  selector:
    app: redis
  # 头less Service：为 StatefulSet 提供 redis-node-N.redis 稳定 DNS。
  # Redis 实际监听 7001（客户端端口）与 17001（集群总线），
  # 原先声明的 6379 没有任何进程监听。
  ports:
    - name: client
      port: 7001
      targetPort: 7001
    - name: cluster-bus
      port: 17001
      targetPort: 17001
  clusterIP: None
